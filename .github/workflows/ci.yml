# CI mirrors the Stop hook: ./verify fast, nothing more. Economical per
# autonomous Decision 31 — PR + push-to-master, superseded runs cancelled,
# docs-only changes skipped. The leak_gate and ip_gate run here on a bare
# runner (no venv), so they block a merge even when tests are skipped.
name: ci
on:
  push:
    branches: [master]
    paths-ignore: ["**.md", "!deploy/README.md", "!CLAUDE.md"]   # docs carried the leaks — keep gating them
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: venv + deps (so tests run, not just the gates)
        run: |
          python -m venv venv
          # `mcp<2`: the MCP Python SDK went 2.0 with the 2026-07-28 spec
          # revision and moved `mcp.server.fastmcp`; requirements.txt says
          # `mcp>=1.0` so a fresh install gets 2.0 and mcp_server.py fails to
          # import. Pinned HERE, not in requirements.txt — the migration to the
          # 2.x import path is the resident's change (see integrations/
          # autonomous/brief-1.md addendum), and CI should not silently decide
          # a dependency ceiling for the app. Remove this pin when migrated.
          venv/bin/pip install -r requirements.txt "mcp<2" pytest
      - name: ./verify fast
        run: |
          chmod +x verify
          ./verify fast
